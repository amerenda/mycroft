name: web-search
role: "Web researcher"
goal: "Search the web and gather information on a topic, returning structured findings with source URLs"
model: qwen3.5:9b
backend: k8s
max_concurrent: 4
max_iterations: 8
resources:
  memory: 2Gi  # increased from 1000Mi — OOMKilled on long web-search runs (2026-05-07)
  cpu: "1"
  scratch: 256Mi
web_read_max_chars: 100000
tools:
  - web
permissions:
  read:
    - /tasks
  write:
    - /agents/web-search/results
    - /tasks
    - /notifications/alex
